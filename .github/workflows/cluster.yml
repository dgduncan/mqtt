name: cluster

# Tests the cluster under faults, smoke tests the image and helm chart on kind, and pushes
# the cluster image and the packaged helm chart to GHCR from the default branch and release tags.
# See cluster/DEPLOYMENT.md.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # nightly chaos and smoke runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cluster-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      cluster: ${{ steps.filter.outputs.cluster }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cluster:
              - '*.go'
              - 'go.mod'
              - 'go.sum'
              - 'cluster/**'
              - 'packets/**'
              - 'listeners/**'
              - 'hooks/**'

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
      - name: Lint
        run: helm lint deploy/helm/mochi-cluster -f deploy/helm/mochi-cluster/ci/kind-values.yaml
      - name: Validate manifests
        run: |
          chart=deploy/helm/mochi-cluster
          values=$chart/ci/kind-values.yaml
          helm template t $chart -f $values | kubeconform -strict -summary
          helm template t $chart -f $values --set tls.enabled=true --set tls.secretName=tls \
            --set websocket.enabled=true --set plainMQTT.enabled=false | kubeconform -strict -summary
          # a chart without auth configured must refuse to render
          ! helm template t $chart 2>/dev/null

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test cluster and cmd/cluster
        run: go test -race ./cluster/... ./cmd/cluster/...

  chaos:
    needs: changes
    # every push and nightly run; pull requests only when the cluster or server changed
    if: github.event_name != 'pull_request' || needs.changes.outputs.cluster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Chaos suite
        working-directory: cluster/chaos
        run: go test -tags chaos -v -timeout 30m
      - name: Upload node logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-logs
          path: cluster/chaos/chaos-logs-*.txt
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Smoke test on kind
        run: ./deploy/kind/smoke.sh

  image:
    needs: [chart, unit, chaos, smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mochi-cluster" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.cluster
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          {
            echo "### Cluster image"
            echo
            echo "\`${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Deploy with \`--set image.digest=${{ steps.build.outputs.digest }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  chart-publish:
    needs: [chart, smoke]
    # a release publishes the version of its tag; a branch push publishes a snapshot
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Chart version
        id: meta
        run: |
          chart=deploy/helm/mochi-cluster
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "app_version=$version" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/^version:[[:space:]]*//p' "$chart/Chart.yaml" | tr -d "\"'")
            # the "sha" prefix keeps the prerelease identifier non-numeric: a SHA starting with 0
            # would otherwise be an invalid version segment
            version="${base}-sha${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package
        run: |
          args=(--version "${{ steps.meta.outputs.version }}" --destination dist)
          if [[ -n "${{ steps.meta.outputs.app_version }}" ]]; then
            args+=(--app-version "${{ steps.meta.outputs.app_version }}")
          fi
          helm package deploy/helm/mochi-cluster "${args[@]}"
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # $GITHUB_ENV only reaches later steps, so keep a local copy for this one
          HELM_REPO="oci://ghcr.io/$owner/charts"
          echo "HELM_REPO=$HELM_REPO" >> "$GITHUB_ENV"
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm push dist/*.tgz "$HELM_REPO"
      - name: Summary
        run: |
          ref="$HELM_REPO/mochi-cluster:${{ steps.meta.outputs.version }}"
          {
            echo "### Helm chart"
            echo
            echo "\`$ref\`"
            echo
            echo '```sh'
            echo "helm install mochi-cluster $HELM_REPO/mochi-cluster \\"
            echo "  --version ${{ steps.meta.outputs.version }} -n mqtt --create-namespace \\"
            echo "  -f my-values.yaml"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
